[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pitch-control"
version = "0.1.0"
license = "MIT"
description = "Spearman (2018) pitch-control model on Metrica Sports sample tracking data"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
